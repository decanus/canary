name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    # Explicit bash enables pipefail, so `cmd | tee` fails the step when cmd fails.
    shell: bash

jobs:
  test:
    name: Go ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: minimum (go.mod)
            go-version-file: go.mod
          - name: stable
            go-version: stable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          go-version-file: ${{ matrix.go-version-file }}
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: Consensus imports only the standard library
        run: |
          deps=$(go list -deps -f '{{if not .Standard}}{{.ImportPath}}{{end}}' ./internal/consensus | grep -v '^github.com/decanus/canary/internal/consensus$' || true)
          test -z "$deps" || { echo "non-stdlib imports in internal/consensus:"; echo "$deps"; exit 1; }
      - name: go test
        run: go test -race -timeout 10m ./...
      - name: Conformance vectors
        run: go run ./cmd/canary vectors

  fuzz:
    name: Fuzz (short)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Fuzz
        run: |
          for f in FuzzValidateBlock FuzzBlockRoundTrip FuzzHeaderRoundTrip; do
            go test ./internal/consensus -run '^$' -fuzz "^$f\$" -fuzztime 20s
          done

  reference:
    name: Python reference cross-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify vector chain with both implementations
        run: |
          python3 -c "import json; v = json.load(open('reference/test_vectors.json')); json.dump({'params': v['params'], 'blocks': v['chain']['blocks']}, open('chain.json', 'w'))"
          python3 reference/canary.py verify chain.json | tee py.txt
          go run ./cmd/canary verify chain.json | tee go.txt
          diff py.txt go.txt
      - name: Mine with Go, verify with Python
        run: |
          go run ./cmd/canary mine --chain mined.json --blocks 5 --genesis-bits 32 --epoch 4
          python3 reference/canary.py verify mined.json
          go run ./cmd/canary verify mined.json
